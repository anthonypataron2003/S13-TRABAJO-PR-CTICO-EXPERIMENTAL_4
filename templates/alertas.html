{% extends "base.html" %}{% block content %}<h1>Alertas de stock bajo</h1><p>Productos con existencias iguales o inferiores al mínimo.</p><section class="panel"><table><tr><th>Producto</th><th>Stock actual</th><th>Mínimo</th></tr>{% for p in productos %}<tr><td>{{ p.nombre }}</td><td>{{ p.stock }}</td><td>{{ p.minimo }}</td></tr>{% empty %}<tr><td colspan="3">No hay alertas.</td></tr>{% endfor %}</table></section>{% endblock %}
